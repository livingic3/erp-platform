{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh">
  <div class="card p-4" style="width:360px">
    <h4 class="mb-3"><i class="bi bi-boxes"></i> Nimbus ERP</h4>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
