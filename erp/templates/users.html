{% extends "base.html" %}{% block title %}Users{% endblock %}
{% block content %}
<h3 class="mb-3">Users</h3>
<div class="row g-3">
<div class="col-lg-7"><div class="card"><table class="table mb-0"><thead><tr><th>Username</th><th>Role</th></tr></thead><tbody>
{% for u in users %}<tr><td>{{ u.username }}</td><td class="text-capitalize">{{ u.role }}</td></tr>{% endfor %}
</tbody></table></div></div>
<div class="col-lg-5"><div class="card p-3"><h6>Add user</h6>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
<div class="mb-2"><input name="username" class="form-control" placeholder="Username" required></div>
<div class="mb-2"><input name="password" type="password" class="form-control" placeholder="Password (min 6)" required minlength="6"></div>
<div class="mb-2"><select name="role" class="form-select"><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
<button class="btn btn-primary">Create</button></form></div></div>
</div>
{% endblock %}
